name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      # The shared libraries are a sibling checkout (background-tools-lib, public), as on the laptop.
      - uses: actions/checkout@v5
        with:
          path: ev-charger-booking
      - uses: actions/checkout@v5
        with:
          repository: gareth-jones-zen/background-tools-lib
          path: background-tools-lib
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: ev-charger-booking/global.json
      # The tests include the form filled in a real headless Edge, against the local mock only.
      - name: Build and test
        working-directory: ev-charger-booking
        run: dotnet test -c Release
      - name: Publish (Native AOT)
        working-directory: ev-charger-booking
        run: |
          dotnet publish src/EvChargerBooking.Console -c Release -r win-x64 -o out
          dotnet publish src/EvChargerBooking.Background -c Release -r win-x64 -o out
          Get-ChildItem out/*.exe | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: ev-charger-booking-win-x64
          path: ev-charger-booking/out/*.exe
